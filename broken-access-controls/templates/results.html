{% extends "base.html" %}

{% block title %}Results - Security Engineering Student Portal{% endblock %}

{% block content %}
<div class="max-w-4xl">
    <h2 class="text-3xl font-semibold text-slate-900 mb-2">Assignment Results</h2>
    <p class="text-slate-600 mb-8">Your recent grades for this course.</p>

    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Assignment</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Score</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Grade</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Submitted</th>
                </tr>
            </thead>
            <tbody id="results-body" class="divide-y divide-slate-100">
                <tr>
                    <td colspan="4" class="px-4 py-8 text-center text-sm text-slate-400">Loading results...</td>
                </tr>
            </tbody>
        </table>
    </div>
    <p id="results-error" class="hidden mt-4 text-sm text-red-600"></p>
</div>
{% endblock %}

{% block scripts %}
<script>
    const userId = Number("{{ user.user_id }}");

    async function loadResults() {
        const body = document.getElementById("results-body");
        const errorEl = document.getElementById("results-error");

        try {
            const response = await fetch(`/api/results/${userId}`);
            if (!response.ok) {
                throw new Error("Failed to load results");
            }

            const data = await response.json();
            const results = Array.isArray(data) ? data : (data.results || []);

            if (!results.length) {
                body.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-sm text-slate-400">No results found.</td></tr>`;
                return;
            }

            body.innerHTML = results.map((item) => `
                <tr class="hover:bg-slate-50">
                    <td class="px-4 py-3 text-sm font-medium text-slate-900">${item.assignment ?? item.name ?? "—"}</td>
                    <td class="px-4 py-3 text-sm text-slate-600">${item.score ?? "—"}</td>
                    <td class="px-4 py-3 text-sm text-slate-600">${item.grade ?? "—"}</td>
                    <td class="px-4 py-3 text-sm text-slate-500">${item.submitted ?? item.date ?? "—"}</td>
                </tr>
            `).join("");
        } catch (error) {
            body.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-sm text-slate-400">Unable to load results.</td></tr>`;
            errorEl.textContent = error.message;
            errorEl.classList.remove("hidden");
        }
    }

    loadResults();
</script>
{% endblock %}
