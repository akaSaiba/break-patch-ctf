{% extends "base.html" %}

{% block title %}Classmates - Security Engineering Student Portal{% endblock %}

{% block content %}
<div class="max-w-4xl">
    <h2 class="text-3xl font-semibold text-slate-900 mb-2">Classmates</h2>
    <p class="text-slate-600 mb-8">Students enrolled in your course.</p>

    <div id="classmates-grid" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        <div class="rounded-xl border border-slate-200 bg-white p-4 text-sm text-slate-400 shadow-sm">Loading classmates...</div>
    </div>
    <p id="classmates-error" class="hidden mt-4 text-sm text-red-600"></p>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadClassmates() {
        const grid = document.getElementById("classmates-grid");
        const errorEl = document.getElementById("classmates-error");

        try {
            const response = await fetch("/api/classmates");
            if (!response.ok) {
                throw new Error("Failed to load classmates");
            }

            const data = await response.json();
            const classmates = Array.isArray(data) ? data : (data.classmates || data.students || []);

            if (!classmates.length) {
                grid.innerHTML = `<div class="rounded-xl border border-slate-200 bg-white p-4 text-sm text-slate-400 shadow-sm">No classmates found.</div>`;
                return;
            }

            // Intentionally render only names — UUIDs may be present in the JSON but stay hidden in the UI
            grid.innerHTML = classmates.map((student) => `
                <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm hover:border-purple-300 transition">
                    <div class="flex items-center gap-3">
                        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-purple-100 text-sm font-semibold text-purple-800">
                            ${(student.name || "?").charAt(0).toUpperCase()}
                        </div>
                        <p class="font-medium text-slate-900">${student.name ?? "Unknown"}</p>
                    </div>
                </div>
            `).join("");
        } catch (error) {
            grid.innerHTML = `<div class="rounded-xl border border-slate-200 bg-white p-4 text-sm text-slate-400 shadow-sm">Unable to load classmates.</div>`;
            errorEl.textContent = error.message;
            errorEl.classList.remove("hidden");
        }
    }

    loadClassmates();
</script>
{% endblock %}
