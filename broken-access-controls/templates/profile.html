{% extends "base.html" %}

{% block title %}Profile - Security Engineering Student Portal{% endblock %}

{% block content %}
<div class="max-w-xl">
    <h2 class="text-3xl font-semibold text-slate-900 mb-2">Profile</h2>
    <p class="text-slate-600 mb-8">Update your public name and bio.</p>

    <form id="profile-form" class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm space-y-4">
        <div>
            <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-200"
            >
        </div>
        <div>
            <label for="bio" class="block text-sm font-medium text-slate-700 mb-1">Bio</label>
            <textarea
                id="bio"
                name="bio"
                rows="5"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-200"
            ></textarea>
        </div>
        <p id="profile-status" class="hidden text-sm"></p>
        <button
            type="submit"
            class="rounded-lg bg-purple-800 hover:bg-purple-700 text-white font-medium px-4 py-2.5 transition"
        >
            Save changes
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    const nameInput = document.getElementById("name");
    const bioInput = document.getElementById("bio");
    const statusEl = document.getElementById("profile-status");

    function showStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.className = `text-sm ${isError ? "text-red-600" : "text-emerald-600"}`;
        statusEl.classList.remove("hidden");
    }

    async function loadProfile() {
        try {
            const response = await fetch("/api/profile");
            if (!response.ok) {
                throw new Error("Failed to load profile");
            }

            const data = await response.json();
            nameInput.value = data.name ?? "";
            bioInput.value = data.bio ?? "";
        } catch (error) {
            showStatus(error.message, true);
        }
    }

    document.getElementById("profile-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        statusEl.classList.add("hidden");

        try {
            const response = await fetch("/api/profile", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: nameInput.value,
                    bio: bioInput.value,
                }),
            });

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.detail || data.message || "Failed to update profile");
            }

            showStatus("Profile updated successfully.");
        } catch (error) {
            showStatus(error.message, true);
        }
    });

    loadProfile();
</script>
{% endblock %}
