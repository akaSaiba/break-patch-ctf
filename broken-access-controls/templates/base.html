<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Security Engineering Student Portal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <header class="bg-purple-900 text-white shadow sticky top-0 z-20">
        <div class="px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-semibold tracking-tight">Security Engineering Student Portal</h1>
            <div class="text-sm text-purple-200">
                {% if user is defined and user %}
                    Signed in as <span class="text-white font-medium">{{ user.name }}</span>
                {% endif %}
            </div>
        </div>
    </header>

    <div class="flex min-h-[calc(100vh-64px)]">
        <aside class="w-64 bg-white border-r border-slate-200 shadow-sm shrink-0">
            <nav class="p-4 space-y-1">
                <p class="px-3 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Menu</p>
                <a href="/dashboard" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-purple-50 hover:text-purple-900 {% if request.url.path == '/dashboard' %}bg-purple-100 text-purple-900{% endif %}">Dashboard</a>
                <a href="/results" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-purple-50 hover:text-purple-900 {% if request.url.path == '/results' %}bg-purple-100 text-purple-900{% endif %}">Results</a>
                <a href="/classmates" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-purple-50 hover:text-purple-900 {% if request.url.path == '/classmates' %}bg-purple-100 text-purple-900{% endif %}">Classmates</a>
                <a href="/notes" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-purple-50 hover:text-purple-900 {% if request.url.path == '/notes' %}bg-purple-100 text-purple-900{% endif %}">Notes</a>
                <a href="/profile" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-purple-50 hover:text-purple-900 {% if request.url.path == '/profile' %}bg-purple-100 text-purple-900{% endif %}">Profile</a>
                <div class="pt-4 mt-4 border-t border-slate-200">
                    <a href="/logout" class="block rounded-lg px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50">Sign out</a>
                </div>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-auto">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
