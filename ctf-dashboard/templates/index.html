<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Dashboard & Scoring Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <header class="bg-emerald-900 text-white shadow">
        <div class="max-w-5xl mx-auto px-6 py-4">
            <h1 class="text-2xl font-semibold">CTF Dashboard & Scoring Engine</h1>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-6 py-10 space-y-4">
        <button
            id="test-connection-btn"
            class="bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-4 py-2 rounded"
        >
            Test Target Connection
        </button>
        <pre
            id="result"
            class="bg-slate-900 text-emerald-300 p-4 rounded overflow-x-auto text-sm min-h-[6rem]"
        >Click the button to test connectivity.</pre>
    </main>
    <script>
        document.getElementById("test-connection-btn").addEventListener("click", async () => {
            const resultEl = document.getElementById("result");
            resultEl.textContent = "Loading...";
            try {
                const response = await fetch("/verify/a01/test-connection");
                const data = await response.json();
                resultEl.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultEl.textContent = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
