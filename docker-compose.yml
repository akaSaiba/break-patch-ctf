services:
  broken-access-controls:
    container_name: broken-access-controls
    build: ./broken-access-controls
    ports:
      - "5000:5000"
    volumes:
      - ./broken-access-controls:/app
    command: uvicorn main:app --host 0.0.0.0 --port 5000 --reload

  ctf-dashboard:
    container_name: ctf-dashboard
    build: ./ctf-dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./ctf-dashboard:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - broken-access-controls
