<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Security Engineering Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <header class="bg-purple-900 text-white shadow">
        <div class="max-w-5xl mx-auto px-6 py-4">
            <h1 class="text-xl font-semibold tracking-tight">Security Engineering Student Portal</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-16">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
            <h2 class="text-2xl font-semibold text-slate-900 mb-1">Sign in</h2>
            <p class="text-sm text-slate-500 mb-6">Enter your student credentials to continue.</p>

            <form id="login-form" action="/login" method="post" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-200"
                    >
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-200"
                    >
                </div>
                <p id="login-error" class="{% if error %}{% else %}hidden{% endif %} text-sm text-red-600" role="alert">{% if error %}{{ error }}{% endif %}</p>
                <button
                    type="submit"
                    id="login-submit"
                    class="w-full rounded-lg bg-purple-800 hover:bg-purple-700 text-white font-medium px-4 py-2.5 transition disabled:opacity-60"
                >
                    Sign in
                </button>
            </form>
        </div>
    </main>

    <script>
        function showLoginError(message) {
            const errorEl = document.getElementById("login-error");
            errorEl.textContent = message;
            errorEl.classList.remove("hidden");
        }

        function parseErrorMessage(data) {
            if (!data) return "Invalid username or password";
            if (typeof data.message === "string") return data.message;
            if (typeof data.detail === "string") return data.detail;
            if (Array.isArray(data.detail)) {
                return data.detail.map((item) => item.msg || JSON.stringify(item)).join(", ");
            }
            return "Invalid username or password";
        }

        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            event.stopPropagation();

            const errorEl = document.getElementById("login-error");
            const submitBtn = document.getElementById("login-submit");
            errorEl.classList.add("hidden");
            errorEl.textContent = "";
            submitBtn.disabled = true;

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || data.status !== "ok") {
                    showLoginError(parseErrorMessage(data));
                    return;
                }

                window.location.href = "/dashboard";
            } catch (error) {
                showLoginError(error.message || "Unable to sign in. Please try again.");
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
