{% extends "base.html" %}
{% block title %}Activities - Elite University Portal{% endblock %}
{% block content %}
<div class="max-w-3xl">
    <h2 class="text-3xl font-semibold">Campus Activities</h2>
    <p class="mt-2 text-slate-600">Search approved activities and their Personal Points rewards.</p>
    <div class="mt-6 flex gap-2">
        <input id="query" class="flex-1 rounded-lg border border-slate-300 px-3 py-2" placeholder="Search activities" />
        <button id="search" class="rounded-lg bg-purple-900 px-5 py-2 text-white">Search</button>
    </div>
    <p id="error" class="mt-4 hidden rounded-lg bg-red-50 p-3 text-sm text-red-700"></p>
    <div id="results" class="mt-5 space-y-3"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
function errorMessage(data) {
  if (!data) return "Search failed";
  if (typeof data.detail === "string") return data.detail;
  if (Array.isArray(data.detail)) {
    return data.detail.map((item) => item.msg || JSON.stringify(item)).join("; ");
  }
  return data.message || "Search failed";
}

function renderResults(items) {
  const results = document.getElementById("results");
  if (!items.length) {
    results.innerHTML = '<p class="text-slate-500">No activities found.</p>';
    return;
  }
  results.innerHTML = items.map((item) => `
    <div class="rounded-xl bg-white p-4 shadow-sm">
      <strong>${item.title}</strong>
      <span class="float-right text-purple-800">${item.points} points</span>
    </div>
  `).join("");
}

async function search() {
  const q = document.getElementById("query").value.trim();
  const error = document.getElementById("error");
  const results = document.getElementById("results");
  const url = "/api/activities/search?query=" + encodeURIComponent(q);

  error.classList.add("hidden");
  error.textContent = "";
  results.innerHTML = "";

  const response = await fetch(url);

  // Unhandled server crashes: open the debug traceback page.
  if (response.status >= 500) {
    window.location.href = url;
    return;
  }

  // Handled API errors (e.g. HTTP 400 after a patch): stay on the page.
  if (!response.ok) {
    let data = null;
    try {
      data = await response.json();
    } catch (_) {}
    error.textContent = errorMessage(data);
    error.classList.remove("hidden");
    return;
  }

  const data = await response.json();
  const needle = q.toLowerCase();
  const filtered = Array.isArray(data)
    ? data.filter((item) => String(item.title || "").toLowerCase().includes(needle))
    : [];

  renderResults(filtered);
}

document.getElementById("search").onclick = search;
document.getElementById("query").addEventListener("keydown", (e) => {
  if (e.key === "Enter") search();
});
search();
</script>
{% endblock %}
